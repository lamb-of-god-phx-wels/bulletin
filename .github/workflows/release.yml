name: Release Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/verify-release-tag.mjs
      - run: npm test
      - run: npm run build

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build signed per-user installer
        run: npm exec electron-builder -- --config electron-builder.config.cjs --win --publish never
        env:
          BULLETIN_REQUIRE_SIGNING: '1'
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          AZURE_ARTIFACT_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_PUBLISHER_NAME }}

      - name: Create checksums
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap' -or $_.Name -match '^latest.*\.yml$'
          }
          $lines = $releaseFiles | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap' -or $_.Name -match '^latest.*\.yml$' -or $_.Name -eq 'SHA256SUMS.txt'
          } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "Bulletin Builder $env:GITHUB_REF_NAME"
