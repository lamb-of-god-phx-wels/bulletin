[build]
# An explicit target keeps host-side proc macros dynamic while applying the
# static-CRT flag only to the worker and its target dependency closure.
target = "x86_64-unknown-linux-gnu"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-C", "target-feature=+crt-static"]

[net]
offline = true
