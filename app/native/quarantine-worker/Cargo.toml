[package]
name = "cbb-quarantine-worker"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
hex = "0.4.3"
jpeg-decoder = { version = "0.3.1", default-features = false }
png = "0.17.16"
quick-xml = "0.39.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ttf-parser = { version = "0.25.1", features = ["std", "variable-fonts"] }
flate2 = { version = "1.1.0", default-features = false, features = ["rust_backend"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
