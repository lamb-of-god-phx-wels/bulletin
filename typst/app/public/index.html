<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Church Bulletin Builder</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <p>Typst WYSIWYG Builder</p>
        <h1>Church Bulletin Builder</h1>
      </div>

      <div class="toolbarControls">
        <select id="kindSelect" aria-label="Project kind">
          <option value="bulletin">Bulletin</option>
          <option value="template">Template</option>
        </select>
        <select id="projectSelect" aria-label="Project"></select>
        <input id="projectName" aria-label="Project name" placeholder="06 28 2026">
        <button id="newButton" type="button">New</button>
        <button id="saveButton" type="button">Save</button>
        <button id="buildButton" type="button" class="primary">Build PDF</button>
        <label class="toggle"><input id="liveToggle" type="checkbox" checked> Live PDF</label>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel palettePanel">
        <div class="panelHeader">
          <h2>Elements</h2>
          <p>Drag onto the page or click to add.</p>
        </div>

        <div class="palette">
          <button type="button" draggable="true" data-add="text">
            <span>Textbox</span>
            <small>Styled text with schema data</small>
          </button>
          <button type="button" draggable="true" data-add="image">
            <span>Image</span>
            <small>Logo, photo, or artwork</small>
          </button>
          <button type="button" draggable="true" data-add="grid">
            <span>Grid Container</span>
            <small>Rows and columns</small>
          </button>
          <button type="button" draggable="true" data-add="stack">
            <span>Stack Container</span>
            <small>Vertical or horizontal flow</small>
          </button>
          <button type="button" draggable="true" data-add="music">
            <span>Music</span>
            <small>Lead sheet placeholder</small>
          </button>
        </div>

        <div class="assetBox">
          <h3>Image Assets</h3>
          <select id="assetSelect"></select>
          <button id="applyAssetButton" type="button">Use On Selected Image</button>
        </div>
      </aside>

      <aside class="panel inspectorPanel">
        <div class="panelHeader">
          <h2>Element Data</h2>
          <p id="selectionHint">Select an element to edit its properties.</p>
        </div>
        <div id="inspector" class="inspectorEmpty">No element selected.</div>
      </aside>

      <section class="stagePanel">
        <div class="stageHeader">
          <div>
            <h2>Drag-and-drop Area</h2>
            <p id="statusText">Loading...</p>
          </div>
          <div class="stageTools">
            <button id="deleteButton" type="button">Delete Selected</button>
            <button id="duplicateButton" type="button">Duplicate</button>
          </div>
        </div>

        <div class="stageScroll">
          <div id="pageCanvas" class="pageCanvas" aria-label="WYSIWYG page canvas"></div>
        </div>

        <details class="pdfDrawer" open>
          <summary>PDF Preview and Build Output</summary>
          <div class="pdfGrid">
            <iframe id="pdfFrame" title="Generated PDF preview"></iframe>
            <pre id="buildOutput" aria-live="polite"></pre>
          </div>
        </details>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
